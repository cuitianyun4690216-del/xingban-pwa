<body>
  <div id="boot-error" style="display:none;position:fixed;inset:0;z-index:99999;background:#FFFDF7;color:#2B2233;padding:18px;font:13px/1.6 -apple-system,'Microsoft YaHei',sans-serif;overflow:auto;">
    <h2 style="font-size:16px;margin:0 0 8px;">星伴学园启动失败</h2>
    <p style="margin:0 0 10px;color:#8A6D3B;">请把这个画面截图发给开发者。</p>
    <pre id="boot-error-text" style="white-space:pre-wrap;word-break:break-all;background:#F4ECDC;border:1px solid #D9C79C;border-radius:8px;padding:10px;font-size:11px;margin:0 0 12px;"></pre>
    <button onclick="location.reload()" style="padding:10px 18px;border-radius:8px;border:1px solid #D9C79C;background:#F8EAC6;font-size:14px;">重新加载</button>
  </div>
  <script>
    window.__xbErr = (function () {
      var shown = false;
      return function (msg) {
        var box = document.getElementById('boot-error');
        var txt = document.getElementById('boot-error-text');
        if (!box || !txt) return;
        txt.textContent =
          '构建：2026-11-05-diagnostic\n' +
          'UA：' + navigator.userAgent + '\n' +
          'hint：' + msg;
        box.style.display = 'block';
        shown = true;
      };
    })();
    window.addEventListener('error', function (e) {
      var where = (e.filename || '') + ':' + (e.lineno || '');
      window.__xbErr((e.error && (e.error.stack || e.error.message)) || (e.message + ' @' + where));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      window.__xbErr('Promise 错误：' + ((r && (r.stack || r.message)) || r));
    });
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && app.querySelector('.boot')) {
        window.__xbErr('页面已加载，但 Vue 没有启动（可能是旧版 WebView 不支持某些语法）。');
      }
    }, 5000);
  </script>
  <div id="app">
    <div class="boot">
      <div class="boot__orb"></div>
      <p class="boot__text">星伴学园正在点亮灯火…</p>
    </div>
  </div>
